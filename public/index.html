<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StrikeZone FPS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <div id="crosshair">+</div>

    <div id="hud">
        <div class="health">Health: 100</div>
        <div class="ammo">Ammo: 30/30</div>
    </div>

    <div id="score">Kills: 0</div>

    <div id="start-screen">
        <h1>STRIKEZONE</h1>

        <p>
            WASD • SHIFT • SPACE • MOUSE • CLICK
        </p>

        <button id="start-button" onclick="document.getElementById('start-screen').style.display='none'">
    START GAME
</button>
    </div>

    <!-- 3D engine -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

    <!-- Our FPS game -->
    <script src="game.js"></script>

</body>
</html>
